<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CityCube Warehousing – Storage Manager</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef5fa;--card:#fff;--tx:#14284f;--mut:#5d6f8c;--bd:#d3e0ec;--nv:#1b3a78;--ac:#3fb4d4;--bl:#2f8fc0;--ok:#157a55;--wr:#c0392b;--hd:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1626;--card:#16223a;--tx:#e6eefb;--mut:#9fb0cc;--bd:#2a3b5c;--nv:#5b8be0;--hd:#16223a}}
:root[data-theme=dark]{--bg:#0e1626;--card:#16223a;--tx:#e6eefb;--mut:#9fb0cc;--bd:#2a3b5c;--nv:#5b8be0;--hd:#16223a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--hd);border-bottom:4px solid var(--ac);padding:8px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:58px;background:#fff;border-radius:6px}header small{color:var(--mut);display:block}header h1{margin:0;font-size:18px;color:var(--nv)}
nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;color:var(--nv);border:1px solid var(--bd);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
nav button.on{background:linear-gradient(90deg,var(--nv),var(--bl));border-color:transparent;color:#fff}
main{max-width:1040px;margin:0 auto;padding:16px}
fieldset{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:0 0 14px;padding:14px 16px}
legend{font-weight:700;color:var(--bl);padding:0 6px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 14px}
.w2{grid-column:span 2}@media(max-width:520px){.w2{grid-column:span 1}}
label{display:block;font-size:12px;color:var(--mut);font-weight:600}
input,select,textarea{width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[readonly]{font-weight:700;color:var(--nv)}
.chk{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}.chk label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--tx);font-weight:500}.chk input{width:auto;margin:0}
.btn{background:linear-gradient(90deg,var(--bl),var(--ac));color:#fff;border:0;padding:10px 18px;border-radius:9px;font-weight:700;cursor:pointer;font-size:14px}
.btn.s{background:var(--nv)}.btn.o{background:transparent;color:var(--nv);border:1px solid var(--bd);padding:6px 10px;font-size:12px}.btn.w{background:var(--wr)}
.bar{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding:10px 0;align-items:center}
.th{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.th div{position:relative}.th img{height:70px;border-radius:6px;border:1px solid var(--bd);display:block}
.th b{position:absolute;top:-6px;right:-6px;background:var(--wr);color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;font-size:12px;cursor:pointer;line-height:18px}
.calc{background:linear-gradient(90deg,var(--nv),var(--bl));color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:22px;flex-wrap:wrap;margin-top:10px}.calc div{font-size:12px;opacity:.95}.calc b{display:block;font-size:17px;color:#bff0ff}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.st div{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--mut)}.st b{display:block;font-size:20px;color:var(--nv)}
table{width:100%;border-collapse:collapse;background:var(--card)}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}th{background:var(--nv);color:#fff}
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--bd)}.tag{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--bd)}.tag.ok{background:#157a5526;color:var(--ok)}.tag.od{background:#c0392b26;color:var(--wr)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 18px;border-radius:9px;display:none;z-index:99;max-width:90%}
#md{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}#md>div{background:var(--card);border-radius:14px;padding:18px;max-width:520px;width:100%;max-height:92%;overflow:auto}
#sheet{display:none}
.sh{color:#000;background:#fff;font:11px Arial,sans-serif;padding:4px}.sh .hd{display:flex;align-items:center;gap:12px;border-bottom:3px solid #3fb4d4;padding-bottom:6px;margin-bottom:8px}.sh .hd img{height:62px}.sh .hd .co{flex:1;font-size:10px;color:#333}.sh .hd .co b{font-size:15px;color:#1b3a78}.sh .hd .rt{text-align:right}
.sh h2{margin:0 0 6px;font-size:17px;color:#1b3a78;letter-spacing:1px;text-align:center}.sh table{width:100%;border-collapse:collapse;background:#fff;margin-bottom:6px}.sh td,.sh th{border:1px solid #aab;padding:4px 6px;font-size:11px;color:#000;background:#fff}.sh th{background:#1b3a78;color:#fff}.sh td.k{background:#e8f3fa;font-weight:700;width:17%}.sh .r{text-align:right}
.sh .ph{display:flex;gap:6px;flex-wrap:wrap}.sh .ph img{height:78px;border:1px solid #999}.sh .sg{display:flex;gap:30px;margin-top:38px}.sh .sg div{flex:1;border-top:1px solid #000;padding-top:3px;text-align:center;font-size:10px}
.sh .lb{width:92mm;border:2px solid #1b3a78;border-radius:6px;padding:6px 8px;margin:0 4mm 4mm 0;display:inline-block;vertical-align:top;page-break-inside:avoid;font-size:11px;text-align:center}.sh .lb .lg{height:34px}.sh .lb .ci{font-size:20px;font-weight:700;color:#1b3a78}.sh .lb .lc{font-size:17px;font-weight:700;background:#e8f3fa;margin:4px 0;padding:3px}.sh .lb .qr{width:34mm;height:34mm}.sh .lb .fl{color:#c0392b;font-weight:700}
@media print{body>*:not(#sheet){display:none!important}#sheet{display:block!important}@page{margin:9mm}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body>
<header><img id="lg" alt="CityCube Warehousing"><div><h1>Storage Manager</h1><small>Inbound • Storage • Outbound • Tax Invoice</small></div>
<nav><button id="t1" class="on">New Entry</button><button id="t2">Records (<span id="cnt">0</span>)</button><button id="t3">Settings</button><button id="sv" hidden>⬇ Save last print</button></nav></header>
<main>
<section id="v1"><form onsubmit="return false">
<fieldset><legend>Customer</legend><div class="g">
<label>Customer ID (auto)<input id="cid" readonly></label>
<label>Entry date<input type="date" id="edate"></label>
<label class="w2">Customer / company name *<input id="name"></label>
<label>Customer type<select id="ctype"><option>Individual</option><option>Company</option></select></label>
<label>ID type<select id="idtype"><option>Emirates ID</option><option>Passport</option><option>Driving Licence</option><option>Trade Licence</option><option>Other</option></select></label>
<label>ID number * <small>(returning customers auto-fill)</small><input id="idno"></label>
<label>ID expiry<input type="date" id="idexp"></label>
<label>Customer TRN (VAT, if any)<input id="trn"></label>
<label>Upload ID picture<input type="file" id="idpic" accept="image/*"><div class="th" id="idth"></div></label>
<label class="w2">Address<input id="addr"></label>
<label>Mobile *<input id="mob" type="tel"></label>
<label>Alternate mobile<input id="mob2" type="tel"></label>
<label>Email<input id="email" type="email"></label>
<label>Authorised pick-up person<input id="auth"></label>
<label>Pick-up person ID / mobile<input id="authid"></label>
</div></fieldset>
<fieldset><legend>Storage &amp; Billing</legend><div class="g">
<label>Date of inbound *<input type="date" id="din"></label>
<label>Expected outbound date<input type="date" id="dout"></label>
<label>Storage basis<select id="basis"><option value="CBM">CBM (cubic metre)</option><option value="SQF">SQF (square feet)</option></select></label>
<label>Quantity (<span id="ql">CBM</span>)<input type="number" id="qty" min="0" step="0.01"></label>
<label>Billing cycle<select id="cycle"><option>Daily</option><option selected>Monthly</option><option>Annually</option></select></label>
<label>Rate per unit per cycle (AED)<input type="number" id="rate" min="0" step="0.01"></label>
<label>Security deposit (AED)<input type="number" id="dep" min="0" step="0.01"></label>
<label>Advance paid (AED)<input type="number" id="paid" min="0" step="0.01"></label>
<label>Payment mode<select id="pmode"><option>Cash</option><option>Card</option><option>Bank transfer</option><option>Cheque</option></select></label>
<label>Storage location in warehouse *<input id="loc" placeholder="Zone B / Rack 4 / Bay 12"></label>
</div>
<div class="calc"><div>Chargeable period<b id="cp">–</b></div><div>Storage (excl. VAT)<b id="ec">AED 0.00</b></div><div>Incl. VAT<b id="ev">AED 0.00</b></div><div>Balance due<b id="bd">AED 0.00</b></div><div>Status<b id="stt">Active</b></div></div>
</fieldset>
<fieldset><legend>Goods</legend><div class="g">
<label class="w2">Goods description *<textarea id="desc" rows="2"></textarea></label>
<label>No. of packages / pallets<input type="number" id="pk" min="0"></label>
<label>Total weight (kg)<input type="number" id="wt" min="0" step="0.1"></label>
<label>Declared value (AED)<input type="number" id="val" min="0"></label>
<label>Condition at receipt<select id="cond"><option>Good</option><option>Minor damage</option><option>Damaged</option></select></label>
<label>Invoice / Packing list / Ref<input id="ref"></label>
<label>Received by (staff)<input id="staff"></label>
<label class="w2">Goods pictures (add several – camera or gallery)<input type="file" id="gpic" accept="image/*" multiple><div class="th" id="gth"></div></label>
<div class="w2"><label>Handling flags</label><div class="chk"><label><input type="checkbox" id="fr">Fragile</label><label><input type="checkbox" id="pe">Perishable</label><label><input type="checkbox" id="hz">Hazardous</label><label><input type="checkbox" id="ins">Insured by customer</label></div></div>
<label class="w2">Remarks<textarea id="rem" rows="2"></textarea></label>
</div></fieldset>
<div class="bar"><button class="btn" id="save">💾 Save record</button><button class="btn s" id="pdf">🖨 Print intake form</button><button class="btn s" id="ob">📤 Outbound &amp; Tax Invoice</button><button class="btn s" id="lbl">🏷 Pallet labels</button><button class="btn o" id="new">New entry</button></div>
</form></section>

<section id="v2" hidden>
<div class="st" id="stats"></div>
<div class="bar" style="position:static"><button class="btn s" id="rmd">🔔 Reminders (<span id="rmc">0</span>)</button><button class="btn s" id="mi">🧾 Monthly invoices</button><input id="q" placeholder="Search name, ID, mobile, location…" style="max-width:280px"><select id="sf" style="max-width:140px"><option value="">All status</option><option>Active</option><option>Overdue</option><option>Closed</option></select><button class="btn s" id="csv">⬇ CSV</button><button class="btn s" id="cpy">Copy for Sheets</button><button class="btn" id="sync">☁ Sync all to Google Sheet</button></div>
<div class="tw"><table><thead><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Location</th><th>Size</th><th>In</th><th>Out</th><th>Storage</th><th>Status</th><th>Invoice</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</section>

<section id="v3" hidden><fieldset><legend>Company &amp; Invoice Settings</legend><div class="g">
<label class="w2">Company name<input id="s_co"></label><label>Company TRN<input id="s_trn"></label>
<label class="w2">Address<input id="s_addr"></label><label>Phone<input id="s_ph"></label><label>Email<input id="s_em"></label>
<label>VAT %<input type="number" id="s_vat" step="0.01"></label><label>Invoice prefix<input id="s_pre"></label>
<label class="w2">Access key (must match KEY in the Apps Script – same on every device)<input id="s_key" type="password"></label><label class="w2">Bank details (printed on invoice)<textarea id="s_bank" rows="2"></textarea></label>
<label class="w2">Invoice footer note<input id="s_foot"></label>
<label class="w2">Google Sheet web-app URL (Apps Script – see setup guide)<input id="s_hook" placeholder="https://script.google.com/macros/s/…/exec"></label>
</div><div class="bar" style="position:static"><button class="btn" id="ss">Save settings</button><button class="btn s" id="st">Send test row to Google Sheet</button></div></fieldset></section>
</main>
<div id="md"><div id="mdc"></div></div>
<div id="sheet" class="sh"></div><div class="toast" id="toast"></div>
<style id="shcss"></style>
